<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca | Livros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container"><span class="navbar-brand fw-semibold">📚 Biblioteca</span></div>
  </nav>

  <main class="container py-4 py-lg-5">
    <div id="alert-area" aria-live="polite"></div>
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
      <div><p class="eyebrow mb-1">CATÁLOGO</p><h1 class="h2 mb-1">Livros cadastrados</h1><p class="text-secondary mb-0">Gerencie o acervo da biblioteca.</p></div>
      <button class="btn btn-primary" id="new-book-btn">+ Novo livro</button>
    </div>
    <section class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table align-middle mb-0" id="books-table">
            <thead><tr><th>Título</th><th>Autor</th><th>ISBN</th><th>Categoria</th><th>Ano</th><th>Qtd.</th><th class="text-end">Ações</th></tr></thead>
            <tbody id="books-body"><tr><td colspan="7" class="text-center py-5"><span class="spinner-border spinner-border-sm me-2"></span>Carregando livros...</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="book-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow">
      <form id="book-form" novalidate>
        <div class="modal-header"><h2 class="modal-title fs-5" id="book-modal-title">Novo livro</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
        <div class="modal-body"><div class="row g-3">
          <div class="col-12"><label for="titulo" class="form-label">Título</label><input id="titulo" name="titulo" class="form-control" minlength="3" maxlength="50" required></div>
          <div class="col-md-6"><label for="isbn" class="form-label">ISBN</label><input id="isbn" name="isbn" class="form-control" minlength="13" maxlength="13" pattern="[0-9]{13}" inputmode="numeric" required><div class="invalid-feedback">Informe exatamente 13 números.</div></div>
          <div class="col-md-6"><label for="autor" class="form-label">Autor</label><input id="autor" name="autor" class="form-control" minlength="5" maxlength="50" required></div>
          <div class="col-md-6"><label for="categoria" class="form-label">Categoria</label><select id="categoria" name="categoria" class="form-select" required><option value="">Selecione...</option></select></div>
          <div class="col-md-3"><label for="anoPublicacao" class="form-label">Ano</label><input id="anoPublicacao" name="anoPublicacao" type="number" class="form-control" min="1" required></div>
          <div class="col-md-3"><label for="quantidade" class="form-label">Quantidade</label><input id="quantidade" name="quantidade" type="number" class="form-control" min="0" required></div>
        </div></div>
        <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" id="save-btn" type="submit">Salvar livro</button></div>
      </form>
    </div></div>
  </div>

  <div class="modal fade" id="details-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow"><div class="modal-header"><h2 class="modal-title fs-5">Detalhes do livro</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body" id="details-body"></div></div></div></div>
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content border-0 shadow"><div class="modal-header"><h2 class="modal-title fs-5">Excluir livro?</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body">Esta ação não poderá ser desfeita.</div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-danger" id="confirm-delete-btn">Excluir</button></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script>
</body>
</html>
